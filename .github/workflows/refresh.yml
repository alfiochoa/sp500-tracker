name: Refresh prices
on:
  schedule: [{ cron: "10 */3 * * 1-5" }]   # 8 runs/weekday x 40 symbols = 320 calls (< 800/day free tier)
  workflow_dispatch:
concurrency: refresh
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Refresh next batch (skips cleanly if the secret is absent)
        env: { TWELVE_DATA_API_KEY: "${{ secrets.TWELVE_DATA_API_KEY }}" }
        run: python scripts/refresh.py --batch 40
      - name: Commit data files
        run: |
          git config user.name "sp500-tracker-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/live_prices.csv.gz data/refresh_state.json data/constituents.csv
          git diff --cached --quiet || (git commit -m "chore(data): refresh price batch" && git push)
